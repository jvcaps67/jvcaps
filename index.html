<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JV CAPS | Gorras Premium</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

header{
  padding:45px 20px 35px;
  text-align:center;
  background:
    radial-gradient(circle at top,#302b18 0%,#111 38%,#070707 75%);
  border-bottom:1px solid #292929;
}

.logo{
  font-size:52px;
  font-weight:900;
  letter-spacing:4px;
}

.logo span{
  color:#d4af37;
}

.subtitulo{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
  letter-spacing:3px;
  text-transform:uppercase;
}

.contenedor{
  width:92%;
  max-width:620px;
  margin:30px auto 60px;
}

.titulo{
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.producto{
  overflow:hidden;
  background:linear-gradient(145deg,#1b1b1b,#0d0d0d);
  border:1px solid #303030;
  border-radius:22px;
  box-shadow:0 18px 45px rgba(0,0,0,.5);
  margin-bottom:25px;
}

.producto img{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
  background:#111;
}

.info{
  padding:22px;
}

.nombre{
  font-size:24px;
  font-weight:800;
}

.descripcion{
  color:#999;
  margin-top:7px;
  font-size:14px;
}

.precio{
  color:#d4af37;
  font-size:30px;
  font-weight:900;
  margin-top:12px;
}

.formulario{
  padding:25px;
  background:linear-gradient(145deg,#151515,#0d0d0d);
  border:1px solid #303030;
  border-radius:22px;
}

label{
  display:block;
  font-size:15px;
  font-weight:700;
  margin-bottom:8px;
}

input,
textarea{
  width:100%;
  padding:16px;
  margin-bottom:20px;
  border:1px solid #363636;
  border-radius:13px;
  background:#080808;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#d4af37;
}

textarea{
  resize:none;
  min-height:90px;
}

.entrega{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.opcion{
  flex:1;
  padding:17px 10px;
  margin:0;
  text-align:center;
  background:#0a0a0a;
  border:1px solid #353535;
  border-radius:14px;
  cursor:pointer;
  transition:.2s;
}

.opcion input{
  width:auto;
  margin:0 5px 0 0;
  padding:0;
}

.opcion.activa{
  border-color:#d4af37;
  background:#1c190e;
  color:#d4af37;
}

.direccion{
  display:none;
}

.resumen{
  padding:20px;
  margin-top:5px;
  background:#090909;
  border:1px solid #2d2d2d;
  border-radius:16px;
}

.fila{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:11px 0;
  color:#aaa;
}

.fila strong{
  color:#fff;
}

.total{
  padding-top:16px;
  margin-top:16px;
  border-top:1px solid #333;
  color:#fff;
  font-size:24px;
  font-weight:900;
}

.total span:last-child{
  color:#d4af37;
}

.boton{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#e4c04a,#a67c00);
  color:#080808;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(212,175,55,.18);
}

.boton:active{
  transform:scale(.98);
}

.nota{
  margin-top:14px;
  text-align:center;
  color:#666;
  font-size:12px;
  line-height:1.5;
}

footer{
  padding:25px;
  text-align:center;
  color:#555;
  font-size:13px;
  border-top:1px solid #1d1d1d;
}

@media(max-width:500px){
  .logo{
    font-size:43px;
  }

  .producto img{
    height:280px;
  }

  .entrega{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">JV <span>CAPS</span></div>
  <div class="subtitulo">Gorras Premium</div>
</header>

<div class="contenedor">

  <div class="titulo">🧢 Nuestra gorra</div>

  <div class="producto">

    <!-- CAMBIA "gorra1.jpg" POR EL NOMBRE DE TU IMAGEN -->
    <img src="gorra1.jpg" alt="Gorra Premium JV CAPS">

    <div class="info">
      <div class="nombre">Gorra Premium</div>
      <div class="descripcion">Calidad premium · JV CAPS</div>
      <div class="precio">$420 MXN</div>
    </div>

  </div>

  <div class="formulario">

    <label for="nombre">Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Escribe tu nombre"
    >

    <label>Forma de entrega</label>

    <div class="entrega">

      <label class="opcion activa" id="recoger">
        <input
          type="radio"
          name="entrega"
          value="Recoger"
          checked
          onchange="cambiarEntrega()"
        >
        🏪 Recoger
      </label>

      <label class="opcion" id="domicilio">
        <input
          type="radio"
          name="entrega"
          value="Domicilio"
          onchange="cambiarEntrega()"
        >
        🚗 Domicilio +$50
      </label>

    </div>

    <div class="direccion" id="campoDireccion">

      <label for="direccion">Dirección:</label>

      <textarea
        id="direccion"
        placeholder="Escribe tu dirección completa"
      ></textarea>

    </div>

    <div class="resumen">

      <div class="fila">
        <span>🧢 Gorra × 1</span>
        <strong>$420</strong>
      </div>

      <div class="fila">
        <span>🚗 Envío</span>
        <strong id="envio">$0</strong>
      </div>

      <div class="fila total">
        <span>Total</span>
        <span id="total">$420</span>
      </div>

    </div>

    <button class="boton" onclick="hacerPedido()">
      📲 PEDIR POR WHATSAPP
    </button>

    <div class="nota">
      Tu pedido se enviará directamente por WhatsApp.
    </div>

  </div>

</div>

<footer>
  © 2026 JV CAPS · Gorras Premium
</footer>

<script>

function cambiarEntrega(){

  const seleccion =
    document.querySelector('input[name="entrega"]:checked').value;

  const campoDireccion =
    document.getElementById("campoDireccion");

  const envio =
    document.getElementById("envio");

  const total =
    document.getElementById("total");

  const recoger =
    document.getElementById("recoger");

  const domicilio =
    document.getElementById("domicilio");

  if(seleccion === "Domicilio"){

    campoDireccion.style.display = "block";

    envio.textContent = "$50";

    total.textContent = "$470";

    recoger.classList.remove("activa");

    domicilio.classList.add("activa");

  }else{

    campoDireccion.style.display = "none";

    envio.textContent = "$0";

    total.textContent = "$420";

    domicilio.classList.remove("activa");

    recoger.classList.add("activa");
  }
}


function hacerPedido(){

  const nombre =
    document.getElementById("nombre").value.trim();

  const entrega =
    document.querySelector('input[name="entrega"]:checked').value;

  const direccion =
    document.getElementById("direccion").value.trim();

  if(nombre === ""){

    alert("Por favor escribe tu nombre.");

    return;
  }

  if(entrega === "Domicilio" && direccion === ""){

    alert("Por favor escribe tu dirección.");

    return;
  }

  let mensaje =
    "🔥 *NUEVO PEDIDO - JV CAPS* 🔥\n\n";

  mensaje +=
    "🧢 *Producto:* Gorra Premium\n";

  mensaje +=
    "💰 *Precio:* $420 MXN\n";

  mensaje +=
    "🔢 *Cantidad:* 1 gorra\n";

  mensaje +=
    "👤 *Cliente:* " + nombre + "\n";

  mensaje +=
    "🚚 *Entrega:* " + entrega + "\n";

  if(entrega === "Domicilio"){

    mensaje +=
      "📍 *Dirección:* " + direccion + "\n";

    mensaje +=
      "🚗 *Envío:* $50 MXN\n";

    mensaje +=
      "💵 *TOTAL:* $470 MXN\n";

  }else{

    mensaje +=
      "🚗 *Envío:* $0 MXN\n";

    mensaje +=
      "💵 *TOTAL:* $420 MXN\n";
  }

  mensaje +=
    "\n✅ Quiero realizar este pedido.";

  const numero = "526143640750";

  const url =
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(mensaje);

  window.location.href = url;
}

cambiarEntrega();

</script>

</body>
</html>
