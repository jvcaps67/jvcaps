<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JV CAPS | Gorras Premium</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#08090b;
  color:#fff;
}

header{
  text-align:center;
  padding:45px 20px 35px;
  background:radial-gradient(circle at top,#252525,#08090b 70%);
  border-bottom:1px solid #292929;
}

.logo{
  font-size:48px;
  font-weight:900;
  letter-spacing:3px;
}

.logo span{
  color:#d4af37;
}

.subtitulo{
  color:#999;
  margin-top:8px;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.contenedor{
  width:92%;
  max-width:600px;
  margin:30px auto 60px;
}

.titulo{
  font-size:26px;
  font-weight:800;
  margin-bottom:20px;
}

.producto{
  background:linear-gradient(145deg,#191a1d,#0e0f11);
  border:1px solid #292929;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.producto img{
  width:100%;
  height:320px;
  object-fit:cover;
  display:block;
  background:#111;
}

.info{
  padding:22px;
}

.nombre{
  font-size:23px;
  font-weight:800;
}

.precio{
  color:#d4af37;
  font-size:28px;
  font-weight:900;
  margin-top:8px;
}

.formulario{
  background:#111214;
  border:1px solid #292929;
  border-radius:20px;
  padding:24px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin-bottom:18px;
  border-radius:12px;
  border:1px solid #333;
  background:#08090b;
  color:#fff;
  font-size:16px;
  outline:none;
}

textarea{
  resize:none;
}

input:focus,textarea:focus{
  border-color:#d4af37;
}

.entrega{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

.opcion{
  flex:1;
  padding:16px 10px;
  border:1px solid #333;
  border-radius:14px;
  background:#0b0c0e;
  text-align:center;
  cursor:pointer;
}

.opcion input{
  width:auto;
  margin:0 5px 0 0;
}

.opcion.activa{
  border-color:#d4af37;
  background:#19160c;
}

.direccion{
  display:none;
}

.resumen{
  background:#090a0c;
  border:1px solid #292929;
  border-radius:15px;
  padding:20px;
  margin-top:5px;
}

.fila{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  color:#aaa;
}

.total{
  border-top:1px solid #333;
  padding-top:15px;
  margin-top:15px;
  color:#fff;
  font-size:24px;
  font-weight:900;
}

.total span:last-child{
  color:#d4af37;
}

.boton{
  width:100%;
  border:0;
  margin-top:20px;
  padding:17px;
  border-radius:14px;
  background:linear-gradient(135deg,#d4af37,#a67c00);
  color:#080808;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.nota{
  text-align:center;
  color:#666;
  font-size:12px;
  margin-top:15px;
}

footer{
  text-align:center;
  padding:25px;
  color:#555;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">JV <span>CAPS</span></div>
  <div class="subtitulo">Gorras Premium</div>
</header>

<div class="contenedor">

  <div class="titulo">🧢 Elige tu gorra</div>

  <div class="producto">

    <!-- AQUÍ PONDRÁS TU IMAGEN -->
    <img src="gorra1.jpg" alt="Gorra Premium JV CAPS">

    <div class="info">
      <div class="nombre">Gorra Premium</div>
      <div class="precio">$420 MXN</div>
    </div>

  </div>

  <div class="formulario">

    <label for="nombre">Nombre</label>

    <input
      type="text"
      id="nombre"
      placeholder="Escribe tu nombre"
    >

    <label>Forma de entrega</label>

    <div class="entrega">

      <label class="opcion activa" id="recoger">
        <input
          type="radio"
          name="entrega"
          value="Recoger"
          checked
          onchange="cambiarEntrega()"
        >
        🏪 Recoger
      </label>

      <label class="opcion" id="domicilio">
        <input
          type="radio"
          name="entrega"
          value="Domicilio"
          onchange="cambiarEntrega()"
        >
        🚗 Domicilio +$50
      </label>

    </div>

    <div class="direccion" id="campoDireccion">

      <label for="direccion">Dirección:</label>

      <textarea
        id="direccion"
        rows="3"
        placeholder="Escribe tu dirección completa"
      ></textarea>

    </div>

    <div class="resumen">

      <div class="fila">
        <span>🧢 Gorra × 1</span>
        <strong>$420</strong>
      </div>

      <div class="fila">
        <span>🚗 Envío</span>
        <strong id="envio">$0</strong>
      </div>

      <div class="fila total">
        <span>Total</span>
        <span id="total">$420</span>
      </div>

    </div>

    <button class="boton" onclick="hacerPedido()">
      📲 PEDIR POR WHATSAPP
    </button>

    <div class="nota">
      El pedido se enviará directamente por WhatsApp.
    </div>

  </div>

</div>

<footer>
  © 2026 JV CAPS · Gorras Premium
</footer>

<script>

function cambiarEntrega(){

  const domicilio =
    document.querySelector(
      'input[name="entrega"]:checked'
    ).value === "Domicilio";

  const campo =
    document.getElementById("campoDireccion");

  const envio =
    document.getElementById("envio");

  const total =
    document.getElementById("total");

  const recoger =
    document.getElementById("recoger");

  const domicilioBtn =
    document.getElementById("domicilio");

  if(domicilio){

    campo.style.display="block";

    envio.textContent="$50";

    total.textContent="$470";

    recoger.classList.remove("activa");

    domicilioBtn.classList.add("activa");

  }else{

    campo.style.display="none";

    envio.textContent="$0";

    total.textContent="$420";

    domicilioBtn.classList.remove("activa");

    recoger.classList.add("activa");
  }
}


function hacerPedido(){

  const nombre =
    document.getElementById("nombre").value.trim();

  const entrega =
    document.querySelector(
      'input[name="entrega"]:checked'
    ).value;

  const direccion =
    document.getElementById("direccion").value.trim();

  if(nombre===""){

    alert("Por favor escribe tu nombre.");

    return;
  }

  if(entrega==="Domicilio" && direccion===""){

    alert("Por favor escribe tu dirección.");

    return;
  }

  let mensaje =
    "🔥 *NUEVO PEDIDO - JV CAPS* 🔥\n\n";

  mensaje +=
    "🧢 *Producto:* Gorra Premium\n";

  mensaje +=
    "💰 *Precio:* $420 MXN\n";

  mensaje +=
    "🔢 *Cantidad:* 1 gorra\n";

  mensaje +=
    "👤 *Cliente:* " + nombre + "\n";

  mensaje +=
    "🚚 *Entrega:* " + entrega + "\n";

  if(entrega==="Domicilio"){

    mensaje +=
      "📍 *Dirección:* " + direccion + "\n";

    mensaje +=
      "🚗 *Envío:* $50 MXN\n";

    mensaje +=
      "💵 *TOTAL:* $470 MXN\n";

  }else{

    mensaje +=
      "🚗 *Envío:* $0 MXN\n";

    mensaje +=
      "💵 *TOTAL:* $420 MXN\n";
  }

  mensaje +=
    "\n✅ Quiero realizar este pedido.";

  const numero="526143640750";

  const url=
    "https://wa.me/" +
    numero +
    "?text=" +
    encodeURIComponent(mensaje);

  window.location.href=url;
}

cambiarEntrega();

</script>

</body>
</html>
